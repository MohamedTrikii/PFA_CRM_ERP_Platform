server:
  port: 8443

spring:
  application:
    name: erp-gateway

  main:
    web-application-type: reactive

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180}/realms/erp
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/erp/protocol/openid-connect/certs

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "${CORS_ALLOWED_ORIGINS:http://localhost:4200}"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - TokenRelay=          # forward JWT to downstream services
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 50
            redis-rate-limiter.burstCapacity: 100
            key-resolver: "#{@tenantKeyResolver}"
      routes:
        - id: identity-service
          uri: http://identity-service:8082
          predicates:
            - Path=/api/v1/identity/**
          filters:
            - StripPrefix=0
            - TenantHeaderFilter

        - id: crm-service
          uri: http://crm-service:8083
          predicates:
            - Path=/api/v1/crm/**
          filters:
            - StripPrefix=0
            - TenantHeaderFilter

        - id: sales-service
          uri: http://sales-service:8084
          predicates:
            - Path=/api/v1/sales/**
          filters:
            - StripPrefix=0
            - TenantHeaderFilter

        - id: inventory-service
          uri: http://inventory-service:8085
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=0
            - TenantHeaderFilter

        - id: achat-service
          uri: http://achat-service:8086
          predicates:
            - Path=/api/v1/achats/**
          filters:
            - StripPrefix=0
            - TenantHeaderFilter

        - id: cms-service
          uri: http://cms-service:8087
          predicates:
            - Path=/api/v1/cms/**
          filters:
            - StripPrefix=0
            - TenantHeaderFilter

        - id: ai-service
          uri: http://ai-service:8000
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - StripPrefix=0
            - TenantHeaderFilter

  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: 6379
      password: ${VALKEY_PASSWORD:valkey_secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.erp: DEBUG
