global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8443"]

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8082"]

  - job_name: crm-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["crm-service:8083"]

  - job_name: sales-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sales-service:8084"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8085"]

  - job_name: achat-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["achat-service:8086"]

  - job_name: cms-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cms-service:8087"]

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: zipkin
    metrics_path: /prometheus
    static_configs:
      - targets: ["zipkin:9411"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
