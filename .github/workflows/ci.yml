name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Build and run tests
        run: mvn -B -T 1C test
      - name: SonarCloud Scan (placeholder)
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: build + test ───────────────────────────────────────────────────
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_test
          POSTGRES_DB: erp_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 10s --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: erp
          RABBITMQ_DEFAULT_PASS: erp_test
          RABBITMQ_DEFAULT_VHOST: erp
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 15s --health-timeout 10s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build all modules (skip tests)
        working-directory: backend
        run: mvn -q -DskipTests clean package

      - name: Run identity tests (Testcontainers)
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/erp_db
          SPRING_DATASOURCE_USERNAME: erp
          SPRING_DATASOURCE_PASSWORD: erp_test
        run: mvn -pl identity test

      - name: Run sales tests (Testcontainers)
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/erp_db
          SPRING_DATASOURCE_USERNAME: erp
          SPRING_DATASOURCE_PASSWORD: erp_test
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: erp
          SPRING_RABBITMQ_PASSWORD: erp_test
          SPRING_RABBITMQ_VIRTUAL_HOST: erp
        run: mvn -pl sales test

  # ── AI service: lint + type-check ──────────────────────────────────────────
  ai-service:
    name: AI Service (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        working-directory: ai-service
        run: ruff check app/

  # ── Frontend: build ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build -- --configuration production

  # ── Container security scan ─────────────────────────────────────────────────
  trivy:
    name: Trivy image scan (gateway)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build gateway image
        working-directory: backend
        run: docker build -f gateway/Dockerfile -t erp-gateway:ci .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: erp-gateway:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
