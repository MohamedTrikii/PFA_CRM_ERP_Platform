name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: build + unit & Testcontainers tests ────────────────────────────
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test all modules
        working-directory: backend
        run: mvn -B test

  # ── AI service: lint ────────────────────────────────────────────────────────
  ai-service:
    name: AI Service (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint (ruff)
        working-directory: ai-service
        run: |
          pip install ruff==0.15.12
          ruff check app/

      - name: API tests (pytest)
        working-directory: ai-service
        # Training libraries (Prophet, XGBoost, MLflow) are optional imports: tests mock them.
        run: |
          pip install $(grep -iE '^(fastapi|pydantic|pydantic-settings|httpx|asyncpg|numpy|prometheus-fastapi-instrumentator|python-jose)[=\[]' requirements.txt) pytest pytest-asyncio
          pytest -q

  # ── Frontend: production build ──────────────────────────────────────────────
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build -- --configuration production
