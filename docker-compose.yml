# ─────────────────────────────────────────────
# ERP Platform – local dev stack
# Usage: docker-compose up -d
# ─────────────────────────────────────────────

networks:
  erp-net:
    driver: bridge

volumes:
  pg_data:
  valkey_data:
  seaweed_master:
  seaweed_volume:
  rabbitmq_data:
  keycloak_data:
  prometheus_data:
  grafana_data:
  loki_data:
  ollama_data:

services:

  # ── PostgreSQL 16 + pgvector ───────────────
  postgres:
    image: pgvector/pgvector:pg16
    pull_policy: if_not_present
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - erp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Valkey (Redis-compatible, BSD-3) ───────
  valkey:
    image: valkey/valkey:8.0
    pull_policy: if_not_present
    container_name: erp-valkey
    restart: unless-stopped
    command: valkey-server --requirepass ${VALKEY_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - erp-net
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak 24 ────────────────────────────
  keycloak:
    image: keycloak/keycloak:24.0
    pull_policy: if_not_present
    container_name: erp-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KC_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: "http://localhost:8180"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    networks:
      - erp-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ── SeaweedFS (S3-compatible, Apache 2.0) ──
  seaweed-master:
    image: chrislusf/seaweedfs:latest
    pull_policy: if_not_present
    container_name: erp-seaweed-master
    restart: unless-stopped
    command: master -ip=seaweed-master -ip.bind=0.0.0.0
    ports:
      - "9333:9333"
    volumes:
      - seaweed_master:/data
    networks:
      - erp-net

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    pull_policy: if_not_present
    container_name: erp-seaweed-volume
    restart: unless-stopped
    command: volume -mserver=seaweed-master:9333 -ip.bind=0.0.0.0 -port=8081 -publicUrl=localhost:8081
    ports:
      - "8081:8081"
    volumes:
      - seaweed_volume:/data
    networks:
      - erp-net
    depends_on:
      - seaweed-master

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    pull_policy: if_not_present
    container_name: erp-seaweed-filer
    restart: unless-stopped
    command: filer -master=seaweed-master:9333 -ip.bind=0.0.0.0 -s3
    ports:
      - "8888:8888"
      - "8333:8333"   # S3 API port
    networks:
      - erp-net
    depends_on:
      - seaweed-master
      - seaweed-volume

  # ── RabbitMQ 3.13 ─────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    pull_policy: if_not_present
    container_name: erp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: erp
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"   # Prometheus metrics
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - erp-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Prometheus ────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    pull_policy: if_not_present
    container_name: erp-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - erp-net

  # ── Grafana 9.5 (Apache 2.0) ──────────────
  grafana:
    image: grafana/grafana:9.5.20
    pull_policy: if_not_present
    container_name: erp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - erp-net
    depends_on:
      - prometheus

  # ── Spring Cloud Gateway ──────────────────
  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: erp-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: default
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180
      VALKEY_HOST: valkey
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      ZIPKIN_URL: http://zipkin:9411
    ports:
      - "8443:8443"
    networks:
      - erp-net
    depends_on:
      keycloak:
        condition: service_healthy

  # ── Identity Service ──────────────────────
  identity-service:
    build:
      context: ./backend
      dockerfile: identity/Dockerfile
    container_name: erp-identity
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180
      ZIPKIN_URL: http://zipkin:9411
    ports:
      - "8082:8082"
    networks:
      - erp-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── CRM Service ──────────────────────────
  crm-service:
    build:
      context: ./backend
      dockerfile: crm/Dockerfile
    container_name: erp-crm
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180
      ZIPKIN_URL: http://zipkin:9411
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    ports:
      - "8083:8083"
    networks:
      - erp-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Sales Service ─────────────────────────
  sales-service:
    build:
      context: ./backend
      dockerfile: sales/Dockerfile
    container_name: erp-sales
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-erp_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-erp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-erp}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-erp_secret}
      SPRING_RABBITMQ_VIRTUAL_HOST: erp
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    ports:
      - "8084:8084"
    networks:
      - erp-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Inventory Service ─────────────────────
  inventory-service:
    build:
      context: ./backend
      dockerfile: inventory/Dockerfile
    container_name: erp-inventory
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-erp_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-erp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-erp}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-erp_secret}
      SPRING_RABBITMQ_VIRTUAL_HOST: erp
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    ports:
      - "8085:8085"
    networks:
      - erp-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Achat Service ────────────────────────
  achat-service:
    build:
      context: ./backend
      dockerfile: achat/Dockerfile
    container_name: erp-achat
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-erp_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-erp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-erp}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-erp_secret}
      SPRING_RABBITMQ_VIRTUAL_HOST: erp
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    ports:
      - "8086:8086"
    networks:
      - erp-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── CMS Service ──────────────────────────
  cms-service:
    build:
      context: ./backend
      dockerfile: cms/Dockerfile
    container_name: erp-cms
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-erp_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-erp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180
      SEAWEEDFS_FILER_URL: http://seaweed-filer:8888
      ZIPKIN_URL: http://zipkin:9411
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    ports:
      - "8087:8087"
    networks:
      - erp-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Zipkin (distributed tracing) ─────────
  zipkin:
    image: openzipkin/zipkin:3
    pull_policy: if_not_present
    container_name: erp-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - erp-net

  # ── Ollama (local LLM, MIT license) ──────
  # Start with: docker-compose --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    pull_policy: if_not_present
    profiles: ["ai"]
    container_name: erp-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - erp-net
    # GPU (optional) — uncomment to enable NVIDIA GPU pass-through:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Loki (log aggregation, Apache 2.0) ───
  loki:
    image: grafana/loki:2.9.7
    pull_policy: if_not_present
    container_name: erp-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - erp-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Promtail (log shipper) ────────────────
  promtail:
    image: grafana/promtail:2.9.7
    pull_policy: if_not_present
    container_name: erp-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - erp-net
    depends_on:
      loki:
        condition: service_healthy

  # ── AI Service (FastAPI) ──────────────────
  # Start with: docker-compose --profile ai up -d
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    profiles: ["ai"]
    container_name: erp-ai
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp_secret}@postgres:5432/${POSTGRES_DB:-erp_db}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      EMBED_DIM: ${EMBED_DIM:-1536}  # set to 768 after running V2 migration
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: erp
      DEV_AUTH_BYPASS: "false"
    ports:
      - "8000:8000"
    networks:
      - erp-net
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      keycloak:
        condition: service_healthy
